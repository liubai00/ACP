# ACP 平台单机部署。在 deploy/ 目录执行：docker compose up -d
# 所有可调参数都在同目录的 .env（由 install.sh 从 .env.example 生成）。
name: acp

x-n8n-env: &n8n-env
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  GENERIC_TIMEZONE: ${TZ:-Asia/Shanghai}
  TZ: ${TZ:-Asia/Shanghai}
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "720"
  # 工作流里用 $env 读取下列变量（见 n8n/build_workflows.py）
  ACP_API_URL: http://coordinator:8000
  ACP_CONNECTOR_TOKEN: ${ACP_CONNECTOR_TOKEN}
  ACP_NOTIFY_TOKEN: ${ACP_NOTIFY_TOKEN}
  BRIDGE_FORWARD_TOKEN: ${BRIDGE_FORWARD_TOKEN}
  GITLAB_WEBHOOK_TOKEN: ${GITLAB_WEBHOOK_TOKEN}
  GITLAB_URL: ${GITLAB_URL:-}
  GITLAB_BOT_TOKEN: ${GITLAB_BOT_TOKEN:-}
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
  FEISHU_BASE_URL: ${FEISHU_BASE_URL:-https://open.feishu.cn}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: acp
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp -d acp"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  coordinator:
    build:
      context: ../coordinator
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: acp/coordinator:${ACP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ACP_DATABASE_URL: postgresql+psycopg://acp:${POSTGRES_PASSWORD}@postgres:5432/acp
      ACP_PUBLIC_URL: ${ACP_PUBLIC_URL}
      ACP_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      ACP_ADMIN_USERNAME: ${ACP_ADMIN_USERNAME:-admin}
      ACP_ADMIN_PASSWORD: ${ACP_ADMIN_PASSWORD}
      ACP_CONNECTOR_TOKEN: ${ACP_CONNECTOR_TOKEN}
      ACP_NOTIFY_TOKEN: ${ACP_NOTIFY_TOKEN}
      ACP_BRIDGE_TOKEN: ${BRIDGE_FORWARD_TOKEN}
      ACP_GITLAB_WEBHOOK_TOKEN: ${GITLAB_WEBHOOK_TOKEN}
      ACP_FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      ACP_FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      ACP_FEISHU_BASE_URL: ${FEISHU_BASE_URL:-https://open.feishu.cn}
      ACP_FEISHU_CHAT_IDS: ${FEISHU_CHAT_IDS:-}
      ACP_FEISHU_INTAKE_MODE: ${FEISHU_INTAKE_MODE:-at_mention,shortcut}
      ACP_NOTIFY_MODE: ${ACP_NOTIFY_MODE:-n8n}
      ACP_N8N_NOTIFY_URL: http://n8n:5678/webhook/acp-notify
      ACP_N8N_INTERNAL_URL: http://n8n:5678
      ACP_N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-}
      ACP_N8N_API_KEY: ${N8N_API_KEY:-}
      ACP_GITLAB_URL: ${GITLAB_URL:-}
      ACP_GITLAB_BOT_TOKEN: ${GITLAB_BOT_TOKEN:-}
      ACP_LLM_ENABLED: ${ACP_LLM_ENABLED:-false}
      ACP_LLM_BASE_URL: ${ACP_LLM_BASE_URL:-http://agentgateway:3001/v1}
      ACP_LLM_MODEL: ${ACP_LLM_MODEL:-}
      ACP_LLM_REASONING_EFFORT: ${ACP_LLM_REASONING_EFFORT:-}
      ACP_LLM_API_STYLE: openai
      ACP_AGENT_LEVEL_DEFAULT: ${ACP_AGENT_LEVEL_DEFAULT:-L0}
      ACP_SEED_DEMO: ${ACP_SEED_DEMO:-false}
      ACP_LOG_LEVEL: ${ACP_LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}
    secrets: [jwt_private]
    networks: [internal]

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:${AGENTGATEWAY_VERSION:-v1.7.0}
    restart: unless-stopped
    command: ["-f", "/etc/agentgateway/config.yaml"]
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      SESSION_KEY: ${AGW_SESSION_KEY}
    volumes:
      - ./agentgateway/config.yaml:/etc/agentgateway/config.yaml:ro
    depends_on:
      coordinator: { condition: service_healthy }
    networks: [internal]

  feishu-bridge:
    build:
      context: ../feishu-bridge
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: acp/feishu-bridge:${ACP_VERSION:-local}
    restart: unless-stopped
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_DOMAIN: ${FEISHU_BASE_URL:-https://open.feishu.cn}
      BRIDGE_FORWARD_URL: ${BRIDGE_FORWARD_URL:-http://n8n:5678/webhook/feishu-events}
      BRIDGE_FORWARD_TOKEN: ${BRIDGE_FORWARD_TOKEN}
      BRIDGE_EXTRA_EVENTS: ${BRIDGE_EXTRA_EVENTS:-}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on: [n8n, coordinator]
    networks: [internal]

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-1.123.1}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_PUBLIC_URL}/
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL}/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/import:ro
    networks: [internal]

  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION:-1.123.1}
    restart: unless-stopped
    command: worker
    depends_on: [n8n]
    environment:
      <<: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal]

  # 一次性：导入工作流（激活由 scripts/n8n-provision.sh 完成）
  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-1.123.1}
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["n8n import:workflow --separate --input=/import"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/import:ro
    networks: [internal]

  board:
    build:
      context: ../board
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: acp/board:${ACP_VERSION:-local}
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${ACP_HTTP_PORT:-80}:80"
      - "${ACP_HTTPS_PORT:-443}:443"
      - "${N8N_EXPOSE_PORT:-5678}:5678"
    environment:
      ACP_SITE_ADDRESS: ${ACP_SITE_ADDRESS:-:80}
      N8N_SITE_ADDRESS: ${N8N_SITE_ADDRESS:-:5678}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../acp-link/dist:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [coordinator, agentgateway, board, n8n]
    networks: [internal]

secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  internal:
