<!doctype html>
<html lang="zh-CN" data-theme="discord">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/acp-logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/acp-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="派活 任务榜：多 Agent 协作平台" />
    <title>派活 任务榜</title>
    <script>
      // 首屏前应用主题，避免闪烁；与 src/components/theme/theme-provider.tsx 的存储键保持一致
      ;(function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('acp_theme') || 'discord'
          var mode = localStorage.getItem('acp_mode') || 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.setAttribute('data-theme', theme)
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
