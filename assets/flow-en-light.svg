<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 438" width="840" height="438" role="img" aria-label="A request&#x27;s journey from one chat message to a merged MR: ten steps, two human gates, two loops" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
<title>A request&#x27;s journey from one chat message to a merged MR: ten steps, two human gates, two loops</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.07"/></filter><marker id="m94A3B8" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.6 8.6 5 1.2 8.4" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mDC2626" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.6 8.6 5 1.2 8.4" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD97706" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.2 1.6 8.6 5 1.2 8.4" fill="none" stroke="#D97706" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="839" height="437" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="28" y="40" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">The life of a request</text>
<text x="28" y="61" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">From one chat message to a merged MR. Humans click twice; the platform and each developer&#x27;s own agent do the rest.</text>
<rect x="24" y="92" width="142" height="104" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1" filter="url(#sh)"/>
<circle cx="44" cy="114" r="10.5" fill="#D97706"/>
<text x="44" y="118" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="61" y="118" font-size="9.3" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="0.7">CHAT · HUMAN</text>
<text x="38" y="147" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Say it in chat</text>
<text x="38" y="166" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">@ the bot or DM it,</text>
<text x="38" y="181" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">in plain language</text>
<rect x="186.5" y="92" width="142" height="104" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" filter="url(#sh)"/>
<circle cx="206.5" cy="114" r="10.5" fill="#2563EB"/>
<text x="206.5" y="118" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="223.5" y="118" font-size="9.3" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="0.7">COORDINATOR</text>
<text x="200.5" y="147" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Parse &amp; file</text>
<text x="200.5" y="166" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">Work becomes a task;</text>
<text x="200.5" y="181" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">questions get answers</text>
<rect x="251.148" y="83.25" width="67.352" height="17.5" rx="8.75" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
<text x="284.824" y="95.42" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">submitted</text>
<rect x="349" y="92" width="142" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6" filter="url(#sh)"/>
<circle cx="369" cy="114" r="10.5" fill="#D97706"/>
<text x="369" y="118" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="386" y="118" font-size="9.3" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="0.7">CHAT · HUMAN</text>
<text x="363" y="147" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Claim it</text>
<text x="363" y="166" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">Nothing runs on a dev</text>
<text x="363" y="181" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">machine until they click</text>
<rect x="401.792" y="83.25" width="79.208" height="17.5" rx="8.75" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="441.396" y="95.42" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">HUMAN GATE</text>
<rect x="511.5" y="92" width="142" height="104" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" filter="url(#sh)"/>
<circle cx="531.5" cy="114" r="10.5" fill="#2563EB"/>
<text x="531.5" y="118" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="548.5" y="118" font-size="9.3" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="0.7">COORDINATOR</text>
<text x="525.5" y="147" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Dispatch</text>
<text x="525.5" y="166" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">Sent over an outbound</text>
<text x="525.5" y="181" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">stream; no public IP</text>
<rect x="588.004" y="83.25" width="55.496" height="17.5" rx="8.75" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
<text x="615.752" y="95.42" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">working</text>
<rect x="674" y="92" width="142" height="104" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" filter="url(#sh)"/>
<circle cx="694" cy="114" r="10.5" fill="#059669"/>
<text x="694" y="118" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="711" y="118" font-size="9.3" font-weight="700" fill="#047857" text-anchor="start" letter-spacing="0.7">DEV MACHINE</text>
<text x="688" y="147" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Agent executes</text>
<text x="688" y="166" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">Claude Code / Codex in</text>
<text x="688" y="181" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">an isolated worktree</text>
<rect x="674" y="270" width="142" height="104" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" filter="url(#sh)"/>
<circle cx="694" cy="292" r="10.5" fill="#7C3AED"/>
<text x="694" y="296" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="711" y="296" font-size="9.3" font-weight="700" fill="#6D28D9" text-anchor="start" letter-spacing="0.7">GITLAB</text>
<text x="688" y="325" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Branch · MR · CI</text>
<text x="688" y="344" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">Pushed with the dev&#x27;s</text>
<text x="688" y="359" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">own git identity</text>
<rect x="511.5" y="270" width="142" height="104" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" filter="url(#sh)"/>
<circle cx="531.5" cy="292" r="10.5" fill="#2563EB"/>
<text x="531.5" y="296" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="548.5" y="296" font-size="9.3" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="0.7">COORDINATOR</text>
<text x="525.5" y="325" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">CI green: hold</text>
<text x="525.5" y="344" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">Task parks at the</text>
<text x="525.5" y="359" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">approval gate</text>
<rect x="552.436" y="261.25" width="91.064" height="17.5" rx="8.75" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
<text x="597.968" y="273.42" font-size="9.5" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">auth-required</text>
<rect x="349" y="270" width="142" height="104" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6" filter="url(#sh)"/>
<circle cx="369" cy="292" r="10.5" fill="#D97706"/>
<text x="369" y="296" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="386" y="296" font-size="9.3" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="0.7">CHAT · HUMAN</text>
<text x="363" y="325" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Review &amp; approve</text>
<text x="363" y="344" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">One click on a chat card</text>
<text x="363" y="359" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">showing MR + CI result</text>
<rect x="401.792" y="261.25" width="79.208" height="17.5" rx="8.75" fill="#D97706" stroke="none" stroke-width="1"/>
<text x="441.396" y="273.42" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">HUMAN GATE</text>
<rect x="186.5" y="270" width="142" height="104" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" filter="url(#sh)"/>
<circle cx="206.5" cy="292" r="10.5" fill="#7C3AED"/>
<text x="206.5" y="296" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="223.5" y="296" font-size="9.3" font-weight="700" fill="#6D28D9" text-anchor="start" letter-spacing="0.7">GITLAB</text>
<text x="200.5" y="325" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Merge</text>
<text x="200.5" y="344" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">By a human or GitLab</text>
<text x="200.5" y="359" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">rules, not the platform</text>
<rect x="24" y="270" width="142" height="104" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" filter="url(#sh)"/>
<circle cx="44" cy="292" r="10.5" fill="#2563EB"/>
<text x="44" y="296" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="61" y="296" font-size="9.3" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="0.7">COORDINATOR</text>
<text x="38" y="325" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start">Close &amp; report</text>
<text x="38" y="344" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">Summary posted back;</text>
<text x="38" y="359" font-size="10.2" font-weight="400" fill="#64748B" text-anchor="start">full timeline kept</text>
