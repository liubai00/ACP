<text x="61" y="296" font-size="9.3" font-weight="700" fill="#8DB8FF" text-anchor="start" letter-spacing="0.7">COORDINATOR</text>
<text x="38" y="325" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="start">Close &amp; report</text>
<text x="38" y="344" font-size="10.2" font-weight="400" fill="#93A1B3" text-anchor="start">Summary posted back;</text>
<text x="38" y="359" font-size="10.2" font-weight="400" fill="#93A1B3" text-anchor="start">full timeline kept</text>
